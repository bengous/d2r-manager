[workspace]
resolver = "3"
members = [
    "crates/format",
    "crates/domain",
    "crates/app",
    "crates/infra",
    "crates/server",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
jiff = { version = "0.2.32", default-features = false, features = ["std", "tz-system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tiny_http = "0.12.0"
proptest = "1.9.0"

[workspace.lints.rust]
dead_code = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
