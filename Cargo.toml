[workspace]
resolver = "3"
members = ["crates/format", "crates/domain"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2.0.18"
serde_json = "1.0.151"
proptest = "1.9.0"

[workspace.lints.rust]
dead_code = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
