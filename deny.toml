[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.93

# unicode-ident ships Unicode data under the permissive Unicode-3.0 licence, on
# top of MIT OR Apache-2.0. Permissive, not copyleft: PLAN 5.2 is satisfied.
[[licenses.exceptions]]
name = "unicode-ident"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
